<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Lounge Kilimani</title>
    <style>
        @keyframes glitter {
            0% { text-shadow: 0px 0px 5px #fff, 0px 0px 10px #ff0, 0px 0px 15px #ff4500; }
            50% { text-shadow: 0px 0px 10px #ff4500, 0px 0px 20px #ff0, 0px 0px 25px #ff4500; }
            100% { text-shadow: 0px 0px 5px #fff, 0px 0px 10px #ff0, 0px 0px 15px #ff4500; }
        }

        @keyframes border-glow {
            0% { border-color: #ff0; box-shadow: 0 0 10px #ff0; }
            50% { border-color: #ff4500; box-shadow: 0 0 20px #ff4500; }
            100% { border-color: #ff0; box-shadow: 0 0 10px #ff0; }
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding-bottom: 40px;
        }

        h1 {
            background: linear-gradient(45deg, #ff0, #ff4500, #ff0);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glitter 2s infinite alternate, border-glow 2s infinite alternate;
            border: 5px solid;
            display: inline-block;
            margin-top: 20px;
        }

        .menu-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            margin-top: 30px;
        }

        .menu-section {
            border-radius: 18px;
            padding: 22px 18px 18px;
            border: 3px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .food-menu {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.18), rgba(255, 215, 0, 0.12));
            border-color: rgba(255, 165, 0, 0.8);
        }

        .drink-menu {
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.12), rgba(153, 0, 255, 0.12));
            border-color: rgba(111, 164, 255, 0.8);
        }

        .menu-title {
            background: linear-gradient(90deg, #ff4500, #ff0);
            color: #222;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0px 0px 10px rgba(255, 255, 0, 0.7);
        }

        .drink-menu .menu-title {
            background: linear-gradient(90deg, #1e90ff, #8a2be2);
            color: white;
            box-shadow: 0px 0px 12px rgba(138, 43, 226, 0.7);
        }

        .images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            align-items: center;
        }

        .images img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            border: 2px solid rgba(255,255,255,0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .images img:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.35);
        }

        .footer {
            background-color: #111;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
            width: 100%;
            color: #ff0;
            font-size: 1.2rem;
        }

        .footer a {
            color: #ff4500;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            .images {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.2rem;
                padding: 15px;
            }

            .menu-title {
                font-size: 1.5rem;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ozone lounge</h1>

        <div class="menu-layout">
            <section class="menu-section food-menu">
                <h2 class="menu-title">Food Menu</h2>
                <div class="images">
                    <img src="1.png" alt="Food 1">
                    <img src="2.png" alt="Food 2">
                    <img src="3.png" alt="Food 3">
                    <img src="4.png" alt="Food 4">
                    <img src="5.png" alt="Food 5">
                </div>
            </section>

            <section class="menu-section drink-menu">
                <h2 class="menu-title">Drinks Menu</h2>
                <div class="images">
                    <img src="6.png" alt="Drink 1">
                    <img src="7.png" alt="Drink 2">
                    <img src="8.png" alt="Drink 3">
                    <img src="9.png" alt="Drink 4">
                    <img src="10.png" alt="Drink 5">
                    <img src="11.png" alt="Drink 6">
                </div>
            </section>
        </div>

        <footer class="footer">
            <p>&copy; 2026 Ozone lounge. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
