<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozone Lounge Menu</title>
    <!-- FontAwesome for Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Floating Top Buttons to Switch Between Drinks and Foods */
        .floating-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(17, 17, 17, 0.95);
            padding: 12px 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #ff4500;
        }

        .nav-btn {
            background: #333;
            color: white;
            border: 2px solid #ff0;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active {
            background: linear-gradient(90deg, #ff4500, #ff0);
            color: #222;
            box-shadow: 0px 0px 10px rgba(255, 255, 0, 0.7);
        }

        .container {
            width: 95%;
            max-width: 800px;
            margin: auto;
        }

        h1 {
            color: #ff0;
            padding: 15px;
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 0px 0px 10px #ff4500;
        }

        h2 {
            background: linear-gradient(90deg, #ff4500, #ff0);
            color: #222;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0px 0px 10px rgba(255, 255, 0, 0.7);
        }

        .section {
            margin: 15px 0;
            padding: 15px 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        /* Hide the inactive section */
        .hidden {
            display: none;
        }

        /* Stack images one after the other in order */
        .images {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .images img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        /* Footer */
        .footer {
            background-color: #111;
            padding: 25px 15px;
            text-align: center;
            margin-top: 40px;
            width: 100%;
            color: #ff0;
            font-size: 1.1rem;
            border-top: 2px solid #ff4500;
        }

        .footer p {
            margin: 10px 0;
        }

        .footer a {
            color: #ff4500;
            text-decoration: none;
            font-weight: bold;
        }

        .social-icons {
            margin: 18px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            color: white;
            font-size: 1.8rem;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #ff0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            h2 {
                font-size: 1.4rem;
            }
            .nav-btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Buttons at the Top -->
    <div class="floating-nav">
        <button id="btn-drinks" class="nav-btn active" onclick="showSection('drinks')">🍹 Drinks</button>
        <button id="btn-foods" class="nav-btn" onclick="showSection('foods')">🍗 Foods</button>
    </div>

    <div class="container">
        <h1>OZONE LOUNGE</h1>
        
        <!-- DRINKS SECTION (drink-1.png to drink-12.png) -->
        <div id="drinks" class="section">
            <h2>DRINKS</h2>
            <div class="images">
                <img src="drink-1.png" alt="Drink 1">
                <img src="drink-2.png" alt="Drink 2">
                <img src="drink-3.png" alt="Drink 3">
                <img src="drink-4.png" alt="Drink 4">
                <img src="drink-5.png" alt="Drink 5">
                <img src="drink-6.png" alt="Drink 6">
                <img src="drink-7.png" alt="Drink 7">
                <img src="drink-8.png" alt="Drink 8">
                <img src="drink-9.png" alt="Drink 9">
                <img src="drink-10.png" alt="Drink 10">
                <img src="drink-11.png" alt="Drink 11">
                <img src="drink-12.png" alt="Drink 12">
            </div>
        </div>
        
        <!-- FOODS SECTION (food-1.png to food-5.png) -->
        <div id="foods" class="section hidden">
            <h2>FOODS</h2>
            <div class="images">
                <img src="food-1.png" alt="Food 1">
                <img src="food-2.png" alt="Food 2">
                <img src="food-3.png" alt="Food 3">
                <img src="food-4.png" alt="Food 4">
                <img src="food-5.png" alt="Food 5">
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>📞 Call to Order: <a href="tel:0759881128">0759 881 128</a></p>
        
        <div class="social-icons">
            <!-- Instagram -->
            <a href="https://www.instagram.com/Ozonelounge_lavington" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <!-- Facebook -->
            <a href="https://www.facebook.com/Ozonelounge_lavington" target="_blank" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <!-- WhatsApp -->
            <a href="https://wa.me/254759881128" target="_blank" aria-label="WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <!-- Website -->
            <a href="https://ozonelounge.co.ke/" target="_blank" aria-label="Website">
                <i class="fa-solid fa-globe"></i>
            </a>
        </div>

        <p>🌐 Website: <a href="https://ozonelounge.co.ke/" target="_blank">ozonelounge.co.ke</a></p>
        <p style="font-size: 0.9rem; color: #aaa; margin-top: 15px;">&copy; 2026 Ozone Lounge. All rights reserved.</p>
    </footer>

    <script>
        function showSection(menuType) {
            if (menuType === 'drinks') {
                document.getElementById('drinks').classList.remove('hidden');
                document.getElementById('foods').classList.add('hidden');
                document.getElementById('btn-drinks').classList.add('active');
                document.getElementById('btn-foods').classList.remove('active');
            } else {
                document.getElementById('foods').classList.remove('hidden');
                document.getElementById('drinks').classList.add('hidden');
                document.getElementById('btn-foods').classList.add('active');
                document.getElementById('btn-drinks').classList.remove('active');
            }
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
